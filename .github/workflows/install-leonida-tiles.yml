name: Installera Leonida-kartbilder
on:
  push:
    paths:
      - ".github/workflows/install-leonida-tiles.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Grevens GTA-app
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Hämta GTADB-kartbilder med partial sparse checkout
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/rolux/gtadb.org.git /tmp/gtadb
          cd /tmp/gtadb
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone             '/maps/tiles/6/day/0/*'             '/maps/tiles/6/day/1/*'             '/maps/tiles/6/day/2/*'             '/maps/tiles/6/day/3/*'             '/maps/tiles/6/day/4/*'             '/maps/tiles/6/day/5/*'             '/maps/tiles/6/day/6/*'
          git checkout main
          test -f maps/tiles/6/day/6/6,128,128.jpg
          cd "$GITHUB_WORKSPACE"
          mkdir -p map-tiles/6/day
          cp -a /tmp/gtadb/maps/tiles/6/day/{0,1,2,3,4,5,6} map-tiles/6/day/
          echo "Kartstorlek och filer:"
          du -sm map-tiles/6/day
          find map-tiles/6/day -type f | wc -l
          BYTES=$(du -sb map-tiles/6/day | cut -f1)
          if [ "$BYTES" -gt 850000000 ]; then
            echo "::warning::Kartbilder överstiger storleksbudget. Tar bort nivå 6."
            rm -rf map-tiles/6/day/6
          fi
      - name: Kontrollera nyckelbilder och attribuering
        run: |
          test -f map-tiles/6/day/0/0,1,1.jpg
          test -f map-tiles/6/day/5/5,64,64.jpg
          echo "GTADB.ORG och bidragsgivare, CC BY 4.0" > map-tiles/ATTRIBUTION.txt
          echo "Källa: https://github.com/rolux/gtadb.org" >> map-tiles/ATTRIBUTION.txt
          echo "Licens: https://creativecommons.org/licenses/by/4.0/" >> map-tiles/ATTRIBUTION.txt
      - name: Publicera bildrutor på main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-tiles/
          if git diff --cached --quiet; then
            echo "Kartbilderna är redan installerade"
            exit 0
          fi
          git commit -m "Installera högupplösta Leonida-map tiles lokalt"
          git push origin HEAD:main
